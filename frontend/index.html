<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>FoodReels — Discover Food That Makes You Stop Scrolling</title>
    <meta name="description" content="FoodReels is the premier food discovery platform. Browse short-form food videos from the best restaurants near you. Like, save, and visit your next favourite spot." />
    <meta name="keywords" content="food reels, food videos, restaurant discovery, food delivery, food near me, food social media" />
    <meta name="author" content="FoodReels" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-app.vercel.app/" />
    <meta property="og:title" content="FoodReels — Discover Food That Makes You Stop Scrolling" />
    <meta property="og:description" content="Browse short-form food videos from the best restaurants near you. One scroll away from your next favourite dish." />
    <meta property="og:image" content="https://your-app.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodReels — Discover Food That Makes You Stop Scrolling" />
    <meta name="twitter:description" content="Browse short-form food videos from the best restaurants near you." />
    <meta name="twitter:image" content="https://your-app.vercel.app/og-image.jpg" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ik.imagekit.io" />
    <link rel="preconnect" href="https://ui-avatars.com" />

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FoodReels",
      "description": "Short-form food video discovery platform",
      "url": "https://your-app.vercel.app",
      "applicationCategory": "FoodEstablishment",
      "operatingSystem": "Web"
    }
    </script>
    <!-- Font Awesome 6 Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
