name: FoodReels CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Lint + Test ───────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long_here
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters
      IMAGEKIT_PUBLIC_KEY: public_placeholder
      IMAGEKIT_PRIVATE_KEY: private_placeholder
      IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/placeholder
      MONGO_URI: mongodb://127.0.0.1:27017/foodreels_test
      ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: error

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  # ─── Frontend: Lint + Build ─────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://placeholder.onrender.com
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
